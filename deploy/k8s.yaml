# Kubernetes 部署示例
# 适用场景:在 K8s 集群中跑 mqmirror,镜像远端 RocketMQ 数据到集群内 RocketMQ。
# 假设远端 RocketMQ 通过外部可达地址提供(Headless Service / NodePort / 直连 IP),
# 这种情况下不需要 iptables DNAT。

apiVersion: v1
kind: Namespace
metadata:
  name: mqmirror
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqmirror
  namespace: mqmirror
  labels:
    app: mqmirror
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqmirror
  template:
    metadata:
      labels:
        app: mqmirror
      annotations:
        # 可选:让 prometheus 自动发现抓取
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: mqmirror
          image: rocketmq-mirror:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REMOTE_NAMESRV
              value: "prod-rocketmq-namesrv.external:9876"
            - name: LOCAL_NAMESRV
              value: "rocketmq-namesrv.rocketmq:9876"
            - name: CONSUMER_GROUP
              value: "mirror-consumer"
            - name: PRODUCER_GROUP
              value: "mirror-producer"
            - name: REFRESH_SEC
              value: "30"
            - name: CLUSTER_ID
              value: "k8s-dev"
            - name: LOOP_PREVENTION
              value: "true"
            - name: CONSUME_FROM
              value: "last"
            - name: ON_FAILURE
              value: "reconsume"
            - name: METRICS_PORT
              value: "9100"
            # 白名单:不设 = 全量
            # - name: TOPIC_WHITELIST
            #   value: "topic-a,topic-b"
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 9100
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mqmirror-metrics
  namespace: mqmirror
  labels:
    app: mqmirror
spec:
  selector:
    app: mqmirror
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
  type: ClusterIP
---
# 可选:ServiceMonitor(Prometheus Operator) 让 Prometheus 自动抓取
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mqmirror
  namespace: mqmirror
  labels:
    release: prometheus   # 按实际 prometheus release 名调整
spec:
  selector:
    matchLabels:
      app: mqmirror
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
