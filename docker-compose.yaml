services:
  mqconsole:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmqconsole
    networks:
      - rocketmq
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
    ports:
      - "8080:8082" # 宿主机 8080 → 容器 8082(dashboard 内嵌 Tomcat 监听 8082)
    depends_on:
      namesrv:
        condition: service_healthy
      rmqbroker:
        condition: service_healthy
    restart: on-failure

  namesrv:
    image: apache/rocketmq:5.3.1
    container_name: rmqnamesrv
    ports:
      - 9876:9876
    networks:
      - rocketmq
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep mqnamesrv || exit 1"]
      interval: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  rmqbroker:
    image: apache/rocketmq:5.3.1
    container_name: rmqbroker
    ports:
      - 10909:10909
      - 10911:10911
      - 10912:10912
    environment:
      - NAMESRV_ADDR=namesrv:9876
      - BROKER_IP1=192.168.40.164
    volumes:
      - ./broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf
      - ./broker.conf:/home/rocketmq/rocketmq/conf/broker.conf
    depends_on:
      namesrv:
        condition: service_healthy
    networks:
      - rocketmq
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep mqbroker || exit 1"]
      interval: 5s
      retries: 5
      start_period: 10s
    command: sh mqbroker -c /home/rocketmq/rocketmq/conf/broker.conf
    restart: on-failure

  mqmirror:
    image: ghcr.io/ddouweb/rocketmq-mirror:latest
    container_name: mqmirror
    # iptables DNAT 需要 NET_ADMIN;若不用 DNAT(本地直连/同主机 broker)可去掉
    cap_add:
      - NET_ADMIN
    environment:
      # === 连接 ===
      - REMOTE_NAMESRV=192.168.8.130:9876   # 远端(生产)nameserver
      - LOCAL_NAMESRV=namesrv:9876          # 本地 compose 内的 nameserver

      # === 消费组 ===
      - CONSUMER_GROUP=mirror-consumer
      - PRODUCER_GROUP=mirror-producer

      # === topic 同步策略 ===
      - REFRESH_SEC=30
      # 白名单:留空 = 镜像全部业务 topic;填了就只镜像这些
      # - TOPIC_WHITELIST=p2_v1_patrol_alarm,p2_v1_patrol_point_result

      # === 消费语义 ===
      - CONSUME_FROM=last
      - ON_FAILURE=reconsume

      # === 防环 ===
      - CLUSTER_ID=local-dev
      - LOOP_PREVENTION=true

      # === 监控 ===
      - METRICS_PORT=9100

      # === iptables DNAT(跨 host 场景必须,本地直连可注释掉)===
      - REMOTE_BROKER_CONTAINER_IP=192.168.1.99
      - REMOTE_BROKER_HOST_IP=192.168.8.130
    ports:
      - "9100:9100"   # Prometheus /metrics
    depends_on:
      namesrv:
        condition: service_healthy
      rmqbroker:
        condition: service_healthy
    networks:
      - rocketmq
    restart: on-failure

networks:
  rocketmq:
    driver: bridge
