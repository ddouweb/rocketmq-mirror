name: Docker Dev Build

# 触发条件:推到 main/master 时构建一个 dev 镜像(不发布),验证 Dockerfile 没坏。
# 想发布镜像请打 git tag (v*),会触发 release.yml。
#
# Dockerfile 是多阶段构建(自带 mvn package),所以这里不需要先 setup-java 或 mvn package。
# 测试由 ci.yml 负责。
on:
  push:
    branches: [ main, master ]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'src/**'
      - 'pom.xml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: mqmirror:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/mqmirror.tar

      - name: Smoke test - container starts and exposes /metrics
        run: |
          docker load -i /tmp/mqmirror.tar
          echo "--- image size ---"
          docker images mqmirror:ci --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          echo ""
          docker run -d --name smoke -p 9100:9100 \
            -e REMOTE_NAMESRV=127.0.0.1:9876 \
            -e METRICS_PORT=9100 \
            mqmirror:ci || true
          sleep 5
          # 容器在没真实 nameserver 时会启动失败,但只要 JVM 启动到 metrics server 之前
          # 我们主要验证镜像本身没有 broken。下面这一步如果失败也不阻止 build。
          docker logs smoke 2>&1 | head -30 || true
          docker rm -f smoke || true
